name: PC criado pelo @alves7.pcm

on:
workflow_dispatch:
inputs:
instance_number:
description: 'Instance Number (1-10)'
required: true
default: '1'
type: string

permissions:
contents: read

jobs:
deploy-rdp:
runs-on: windows-latest
timeout-minutes: 30

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: System Information
    shell: pwsh
    run: |
      Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
      Write-Host "Nome: rafael" -ForegroundColor Green
      Write-Host "Instance Number: ${{ inputs.instance_number }}" -ForegroundColor Yellow
      Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
      Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow
      Write-Host "Identificador: rafael37464" -ForegroundColor Green
      Write-Host "Nome desejado do PC: Eva" -ForegroundColor Green

      Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan

      Get-ComputerInfo |
        Select-Object WindowsProductName, WindowsVersion, OsArchitecture

      Get-CimInstance Win32_ComputerSystem |
        Select-Object Name, TotalPhysicalMemory

      Get-CimInstance Win32_Processor |
        Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      Get-PSDrive -PSProvider FileSystem |
        Select-Object Name, Used, Free

      Write-Host "Os recursos dependem do runner do GitHub." -ForegroundColor Yellow

  - name: Check RDP Configuration
    shell: pwsh
    run: |
      Write-Host "=== REMOTE DESKTOP CHECK ===" -ForegroundColor Green

      $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'

      if (Test-Path $rdpPath) {
        $rdpStatus = Get-ItemProperty `
          -Path $rdpPath `
          -Name fDenyTSConnections

        if ($rdpStatus.fDenyTSConnections -eq 0) {
          Write-Host "RDP habilitado na configuracao." -ForegroundColor Green
        }
        else {
          Write-Host "RDP desabilitado na configuracao." -ForegroundColor Yellow
        }
      }
      else {
        Write-Host "Configuracao RDP nao encontrada." -ForegroundColor Yellow
      }

      Write-Host "A verificacao nao cria acesso remoto externo." -ForegroundColor Yellow

  - name: Create User Account
    shell: pwsh
    run: |
      $ErrorActionPreference = 'Stop'

      $Username = 'rafael'
      $GeneratedPassword = $null
      $SecurePassword = $null
      $RandomBytes = New-Object byte[] 32
      $Rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

      try {
        # Gerar senha aleatoria usando API compativel com PowerShell 7.
        $Rng.GetBytes($RandomBytes)
        $RandomText = [Convert]::ToBase64String($RandomBytes)
        $GeneratedPassword = 'Ra@' + $RandomText.Substring(0, 20) + '7!'

        # Registrar o segredo para que o GitHub mascare seu valor nos logs.
        Write-Output "::add-mask::$GeneratedPassword"

        $User = Get-LocalUser `
          -Name $Username `
          -ErrorAction SilentlyContinue

        $SecurePassword = ConvertTo-SecureString `
          $GeneratedPassword `
          -AsPlainText `
          -Force

        if ($null -eq $User) {
          New-LocalUser `
            -Name $Username `
            -Password $SecurePassword `
            -Description "Conta local rafael" |
            Out-Null

          Write-Host "Conta rafael criada." -ForegroundColor Green
        }
        else {
          Set-LocalUser `
            -Name $Username `
            -Password $SecurePassword

          Write-Host "Conta rafael ja existia; senha atualizada." -ForegroundColor Green
        }

        Write-Host "Uma senha aleatoria foi gerada e aplicada a conta." -ForegroundColor Green
        Write-Host "Identificador: rafael37464" -ForegroundColor Green
        Write-Host "Nome desejado do PC: Eva" -ForegroundColor Green

        $OriginalUser = Get-LocalUser `
          -Name 'runneradmin' `
          -ErrorAction SilentlyContinue

        if ($null -ne $OriginalUser) {
          Write-Host "A conta runneradmin existe." -ForegroundColor Green
        }
      }
      finally {
        $SecurePassword = $null
        $GeneratedPassword = $null
        $Rng.Dispose()
        [Array]::Clear($RandomBytes, 0, $RandomBytes.Length)

        Remove-Variable SecurePassword, GeneratedPassword, RandomText `
          -ErrorAction SilentlyContinue
      }

  - name: Install Tailscale
    shell: pwsh
    run: |
      $ErrorActionPreference = 'Stop'

      $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
      $installerPath = Join-Path $env:TEMP 'tailscale.msi'

      try {
        Write-Host "Baixando Tailscale..." -ForegroundColor Green
        Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

        $process = Start-Process `
          -FilePath 'msiexec.exe' `
          -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
          -Wait `
          -PassThru

        if ($process.ExitCode -notin @(0, 3010)) {
          throw "Instalacao do Tailscale falhou. Codigo: $($process.ExitCode)"
        }

        Write-Host "Tailscale instalado." -ForegroundColor Green
      }
      finally {
        if (Test-Path $installerPath) {
          Remove-Item $installerPath -Force
        }
      }

  - name: Check Tailscale Authentication
    shell: pwsh
    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
    run: |
      $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'

      Write-Host "=== TAILSCALE AUTHENTICATION CHECK ===" -ForegroundColor Green

      if (-not (Test-Path $tsExe)) {
        Write-Host "Executavel do Tailscale nao encontrado." -ForegroundColor Yellow
        exit 0
      }

      if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
        Write-Host "TAILSCALE_AUTH_KEY nao foi configurado." -ForegroundColor Yellow
        Write-Host "O dispositivo nao sera autenticado automaticamente." -ForegroundColor Yellow
      }
      else {
        Write-Host "Uma chave de autenticacao foi fornecida." -ForegroundColor Green
        Write-Host "A chave nao sera exibida nos logs." -ForegroundColor Green
        Write-Host "Esta etapa verifica a configuracao; nao inicia uma conexao RDP." -ForegroundColor Yellow
      }

      Remove-Item Env:TAILSCALE_AUTH_KEY -ErrorAction SilentlyContinue

  - name: Get Tailscale Status
    shell: pwsh
    continue-on-error: true
    run: |
      $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'

      Write-Host "Checking Tailscale status..." -ForegroundColor Green

      if (-not (Test-Path $tsExe)) {
        Write-Host "Tailscale nao esta instalado." -ForegroundColor Yellow
        exit 0
      }

      $tsOutput = & $tsExe status 2>&1
      $tsExitCode = $LASTEXITCODE

      $tsOutput | ForEach-Object {
        Write-Host "$_"
      }

      if ($tsExitCode -ne 0) {
        Write-Host "Tailscale desconectado ou nao autenticado." -ForegroundColor Yellow
        Write-Host "O workflow continuara sem uma conexao Tailscale." -ForegroundColor Yellow
        exit 0
      }

      Write-Host "Verificacao do Tailscale concluida." -ForegroundColor Green

  - name: Install Google Chrome
    shell: pwsh
    run: |
      $ErrorActionPreference = 'Stop'

      $chromeUrl = 'https://dl.google.com/chrome/install/latest/chrome_installer.exe'
      $installerPath = Join-Path $env:TEMP 'chrome_installer.exe'

      try {
        Write-Host "Baixando Google Chrome..." -ForegroundColor Green
        Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath

        $process = Start-Process `
          -FilePath $installerPath `
          -ArgumentList '/silent /install' `
          -Wait `
          -PassThru

        if ($process.ExitCode -ne 0) {
          throw "Instalacao do Chrome falhou. Codigo: $($process.ExitCode)"
        }

        Write-Host "Google Chrome instalado." -ForegroundColor Green
      }
      finally {
        if (Test-Path $installerPath) {
          Remove-Item $installerPath -Force
        }
      }

  - name: Install 7-Zip
    shell: pwsh
    run: |
      $ErrorActionPreference = 'Stop'

      $zipUrl = 'https://www.7-zip.org/a/7z2409-x64.exe'
      $installerPath = Join-Path $env:TEMP '7z-installer.exe'

      try {
        Write-Host "Baixando 7-Zip..." -ForegroundColor Green
        Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath

        $process = Start-Process `
          -FilePath $installerPath `
          -ArgumentList '/S' `
          -Wait `
          -PassThru

        if ($process.ExitCode -ne 0) {
          throw "Instalacao do 7-Zip falhou. Codigo: $($process.ExitCode)"
        }

        Write-Host "7-Zip instalado." -ForegroundColor Green
      }
      finally {
        if (Test-Path $installerPath) {
          Remove-Item $installerPath -Force
        }
      }

  - name: Connection Details
    shell: pwsh
    run: |
      Write-Host "`n=== CONNECTION DETAILS ===" -ForegroundColor Green
      Write-Host "Nome: rafael" -ForegroundColor Green
      Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Green
      Write-Host "Instance Number: ${{ inputs.instance_number }}" -ForegroundColor Green
      Write-Host "Identificador: rafael37464" -ForegroundColor Green
      Write-Host "Nome desejado do PC: Eva" -ForegroundColor Green

      Write-Host "`n=== CONNECTION STATUS ===" -ForegroundColor Yellow
      Write-Host "Nenhum endereco RDP externo foi configurado." -ForegroundColor Yellow
      Write-Host "A senha gerada e mascarada nos logs." -ForegroundColor Yellow
      Write-Host "O runner sera descartado ao terminar o job." -ForegroundColor Yellow

  - name: Keep Session Alive
    shell: pwsh
    run: |
      Write-Host "`n=== SESSION CHECK ===" -ForegroundColor Green

      for ($counter = 1; $counter -le 3; $counter++) {
        Write-Host "Verificacao #$counter - $(Get-Date)" -ForegroundColor Green
        Start-Sleep -Seconds 5
      }

      Write-Host "Verificacoes concluidas." -ForegroundColor Green
      Write-Host "O job terminara normalmente." -ForegroundColor Yellow
